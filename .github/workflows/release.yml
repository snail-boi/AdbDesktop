name: Release

# Tag-driven, so a release is cut by pushing a tag rather than by a button:
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag is what the in-app updater compares against, so it must stay numeric
# (v0.1.0, v0.1.1-beta2). Keep it in step with <Version> in AdbDesktop.csproj, which
# is what the running build reports as its own version.
on:
  push:
    tags:
      - 'v*'
  # Lets the packaging be exercised without cutting a release.
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innosetup --yes

      # Produces both the installer and the portable zip into
      # "AdbDesktop installer/output" -- see the PackageRelease targets in the csproj.
      # scrcpy_video.dll is committed under Assets, so the native toolchain is not
      # needed here; the SyncScrcpyVideoDll target no-ops when the build tree is absent.
      - name: Build (Release)
        run: dotnet build "AdbDesktop/AdbDesktop.csproj" -c Release

      - name: Check artifacts exist
        shell: pwsh
        run: |
          $out = "AdbDesktop installer/output"
          $setup = Get-ChildItem "$out/AdbDesktop_Setup.exe" -ErrorAction SilentlyContinue
          $zip   = Get-ChildItem "$out/AdbDesktop_*_portable.zip" -ErrorAction SilentlyContinue
          if (-not $setup) { throw "Installer missing -- did Inno Setup run?" }
          if (-not $zip)   { throw "Portable zip missing." }
          Write-Host "setup:    $($setup.Name) ($([math]::Round($setup.Length/1MB,1)) MB)"
          Write-Host "portable: $($zip.Name) ($([math]::Round($zip.Length/1MB,1)) MB)"

      # Uploaded on workflow_dispatch too, so a manual run is still useful.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adbDesktop-packages
          path: |
            AdbDesktop installer/output/AdbDesktop_Setup.exe
            AdbDesktop installer/output/AdbDesktop_*_portable.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          files: |
            AdbDesktop installer/output/AdbDesktop_Setup.exe
            AdbDesktop installer/output/AdbDesktop_*_portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
